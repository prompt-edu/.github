# Lints this repository's workflows with actionlint, installed with its
# official download script (https://github.com/rhysd/actionlint/blob/main/docs/usage.md).
# Suppressed false positives live in .github/actionlint.yaml.
name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Script pinned to the v1.7.12 tag commit; the argument pins the binary version.
      - name: Download actionlint
        id: get-actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get-actionlint.outputs.executable }} -color
        shell: bash
