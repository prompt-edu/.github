# Reusable PR title check: the PR title becomes the squash commit on main, so
# it must follow Conventional Commits (`type(scope)!: subject`, scope optional).
#
# Callers use the job id `pr-title`, which makes the required status check
# `pr-title / conventional-commit`. Usage: docs/reusable-workflows.md
name: PR Title

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated list of allowed types. Empty uses the action's defaults (feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert).
        required: false
        type: string
        default: ''

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
